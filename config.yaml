# GitHub 搜索配置
github:
  # 按主题/关键词搜索项目
  topics:
    - ai-agent
    - llm-agent
    - multi-agent
    - agent-framework
    - ai-framework
    - large-language-model
    - llm
    - gpt
    - chatbot
    - rag
    - retrieval-augmented-generation
    - deep-learning
    - machine-learning
    - autonomous-agent
    - ai-assistant
    - llm-framework
    - agentic

  # GitHub Trending 页面 URL（抓取热门趋势）
  trending_url: "https://github.com/trending?since=daily"

  # 搜索配置：过去7天内创建，按stars排序
  search_days: 30
  top_n: 15
  min_stars: 50

  # 可选的 GitHub Token（提升API限速，不填也能工作）
  # 获取方式: https://github.com/settings/tokens
  token: ""

